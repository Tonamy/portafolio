<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Bot de Portafolio</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 95vh; margin: 0; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; border-bottom: 1px solid #333; }
        .input-area { display: flex; padding: 15px; background: #1e1e1e; }
        input { flex-grow: 1; background: #333; border: none; color: white; padding: 12px; outline: none; border-radius: 5px; }
        button { background: #3b82f6; border: none; color: white; padding: 10px 20px; margin-left: 10px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #2563eb; }
        .bot-msg { color: #60a5fa; margin-bottom: 10px; }
        .user-msg { color: #e5e7eb; margin-bottom: 10px; text-align: right; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') enviar()">
        <button onclick="enviar()">Enviar</button>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/chat';

        async function enviar() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const msg = input.value.trim();
            
            if (!msg) return;

            // Mostrar mensaje del usuario
            chat.innerHTML += `<p class="user-msg"><b>Tú:</b> ${msg}</p>`;
            input.value = '';

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg, user_id: 'user_123'})
                });
                
                const data = await res.json();
                
                // Mostrar respuesta del bot
                chat.innerHTML += `<p class="bot-msg"><b>Bot:</b> ${data.reply}</p>`;
                chat.scrollTop = chat.scrollHeight; 
            } catch (err) {
                console.error("Error:", err);
                chat.innerHTML += `<p style="color:red;">Error de conexión. Asegúrate de que el servidor Flask esté corriendo.</p>`;
            }
        }
    </script>
</body>
</html>
