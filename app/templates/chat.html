<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; height: 100vh; margin: 0; display: flex; flex-direction: column; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input-area { display: flex; padding: 10px; background: #1e1e1e; border-top: 1px solid #333; }
        input { flex: 1; background: #333; border: 1px solid #444; color: #fff; padding: 10px; }
        button { background: #3b82f6; border: none; color: white; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Escribe tu mensaje...">
        <button onclick="enviar()">Enviar</button>
    </div>
    <script>
        async function enviar() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const msg = input.value;
            if(!msg) return;
            
            chat.innerHTML += `<p><b>Tú:</b> ${msg}</p>`;
            input.value = '';
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await res.json();
                chat.innerHTML += `<p><b>Bot:</b> ${data.reply}</p>`;
                chat.scrollTop = chat.scrollHeight;
            } catch (e) {
                chat.innerHTML += `<p style="color:red;">Error de conexión</p>`;
            }
        }
    </script>
</body>
</html>
