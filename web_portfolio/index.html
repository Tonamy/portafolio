<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistente de Tonatiuh Garza</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 95vh; margin: 0; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #333; }
        #chat p { margin: 6px 0; line-height: 1.4; }
        .input-area { display: flex; padding: 10px; background: #1e1e1e; }
        input { flex-grow: 1; background: #333; border: none; color: white; padding: 10px; outline: none; border-radius: 4px; margin-right: 8px; }
        button { background: #3b82f6; border: none; color: white; padding: 10px 16px; cursor: pointer; border-radius: 4px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .typing { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') enviar()">
        <button id="enviarBtn" onclick="enviar()">Enviar</button>
    </div>

    <script>
        const MENSAJE_APERTURA = "Hola, soy el asistente de Tonatiuh. Ayudo a empresas y profesionales a identificar oportunidades de automatización, integración de sistemas e inteligencia artificial. ¿Hay algún proceso, reto operativo o idea que te gustaría explorar?";
        
        // URL absoluta del servidor Flask
        const API_URL = '/chat';

        function agregarMensaje(autor, texto, esError = false) {
            const chat = document.getElementById('chat');
            const p = document.createElement('p');
            if (esError) p.style.color = 'red';
            p.innerHTML = `<b>${autor}:</b> ${texto}`;
            chat.appendChild(p);
            chat.scrollTop = chat.scrollHeight;
        }

        window.addEventListener('DOMContentLoaded', () => {
            agregarMensaje('Asistente', MENSAJE_APERTURA);
        });

        async function enviar() {
            const input = document.getElementById('msg');
            const boton = document.getElementById('enviarBtn');
            const msg = input.value;
            if (!msg.trim()) return;

            agregarMensaje('Tú', msg);
            input.value = '';
            boton.disabled = true;

            const chat = document.getElementById('chat');
            const typing = document.createElement('p');
            typing.className = 'typing';
            typing.textContent = 'Asistente está escribiendo...';
            chat.appendChild(typing);
            chat.scrollTop = chat.scrollHeight;

            try {
                // CORRECCIÓN AQUÍ: Usamos la URL absoluta
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });

                typing.remove();

                if (!res.ok) {
                    agregarMensaje('Error', `Error del servidor: ${res.status}`, true);
                    return;
                }

                const data = await res.json();
                agregarMensaje('Asistente', data.reply || 'Sin respuesta.');
            } catch (err) {
                typing.remove();
                // Si esto falla, es porque el servidor Flask no está corriendo 
                // o no tiene habilitado el CORS correctamente.
                agregarMensaje('Error', 'No se pudo conectar con el servidor (¿Está ejecutándose Flask?).', true);
            } finally {
                boton.disabled = false;
            }
        }
    </script>
</body>
</html>
