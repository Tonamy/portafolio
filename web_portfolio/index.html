<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 95vh; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .input-area { display: flex; padding: 10px; background: #1e1e1e; }
        input { flex-grow: 1; background: #333; border: none; color: white; padding: 10px; }
        button { background: #3b82f6; border: none; color: white; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Escribe tu mensaje...">
        <button onclick="enviar()">Enviar</button>
    </div>
    <script>
        async function enviar() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const msg = input.value;
            chat.innerHTML += `<p>Tú: ${msg}</p>`;
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const data = await res.json();
            chat.innerHTML += `<p>Bot: ${data.reply}</p>`;
            input.value = '';
        }
    </script>
</body>
</html>
