<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 95vh; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #333; }
        .input-area { display: flex; padding: 10px; background: #1e1e1e; }
        input { flex-grow: 1; background: #333; border: none; color: white; padding: 10px; outline: none; }
        button { background: #3b82f6; border: none; color: white; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') enviar()">
        <button onclick="enviar()">Enviar</button>
    </div>

    <script>
        async function enviar() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const msg = input.value;
            if (!msg.trim()) return;

            chat.innerHTML += `<p><b>Tú:</b> ${msg}</p>`;
            input.value = '';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg, user_id: 'user_123'})
                });
                const data = await res.json();
                chat.innerHTML += `<p><b>Bot:</b> ${data.reply}</p>`;
                chat.scrollTop = chat.scrollHeight; // Auto-scroll al final
            } catch (err) {
                chat.innerHTML += `<p style="color:red;">Error de conexión</p>`;
            }
        }
    </script>
</body>
</html>
